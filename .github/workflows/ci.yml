name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: ai_workforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_workforce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/ai_workforce
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379
      TEST_REDIS_PASSWORD: ''
      TEST_REDIS_DB: 15
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --include=dev

      - name: Run deployment configuration checks
        run: npm run deploy:test

      - name: Run integration test suite
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
